[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "waagd-discovery"
version = "0.6.0"
description = "Independent, deterministic RSS/Atom discovery for WAAGD"
requires-python = ">=3.13"
dependencies = ["httpx==0.28.1", "defusedxml==0.7.1", "PyYAML==6.0.3", "jsonschema==4.26.0", "idna==3.20"]

[project.scripts]
waagd-discovery = "waagd_discovery.cli:main"
waagd-bridge = "waagd_discovery.bridge.cli:main"
waagd-editorial = "waagd_discovery.editorial.cli:main"
waagd-publication-export = "waagd_discovery.editorial.publication_cli:main"
waagd-publication-bridge = "waagd_discovery.editorial.publication_bridge_cli:main"

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-cov==7.0.0", "ruff==0.15.6", "mypy==2.4.0", "types-PyYAML==6.0.12.20250915", "types-defusedxml==0.7.0.20250822", "types-jsonschema==4.26.0.20260202"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["waagd_discovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=waagd_discovery --cov-report=term-missing"
markers = ["live: explicitly invoked network checks"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/waagd_discovery"]
