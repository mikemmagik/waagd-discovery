name: waagd-discovery

services:
  discovery: &discovery-runtime
    image: waagd-discovery:local
    build:
      context: .
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    environment:
      WAAGD_DB: /data/discovery.sqlite3
      WAAGD_SOURCES: /app/config/sources.yaml
      WAAGD_FILTER: /app/config/filter.yaml
      WAAGD_BACKUP_POLICY: /app/config/backup.yaml
      WAAGD_SCHEDULER_CONFIG: /app/config/scheduler.yaml
    volumes:
      - discovery-data:/data
      - type: bind
        source: ./exports
        target: /exports
        bind:
          create_host_path: false
      - type: bind
        source: ./backups
        target: /backups
        bind:
          create_host_path: false
      - type: bind
        source: ./config/sources.yaml
        target: /app/config/sources.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/filter.yaml
        target: /app/config/filter.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/backup.yaml
        target: /app/config/backup.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/scheduler.yaml
        target: /app/config/scheduler.yaml
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    stop_grace_period: 30s
    restart: "no"
    command: ["stats"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  scheduler:
    <<: *discovery-runtime
    profiles: [scheduler]
    command: ["scheduler"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "waagd-discovery", "health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  discovery-data:
