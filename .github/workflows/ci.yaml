name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --frozen --python "${{ matrix.python }}"
      - name: Reject tracked credentials and runtime data
        run: uv run --frozen python scripts/check-secrets.py
      - name: Lint and format
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Check strict types
        run: uv run --frozen mypy src
      - name: Offline tests and coverage
        run: uv run --frozen pytest -m "not live" --cov-fail-under=85

  container:
    name: Docker ${{ matrix.arch }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare isolated build context with private source configurations
        run: python3 scripts/docker-config-smoke.py --prepare-context "${{ runner.temp }}/waagd-config-0600"
      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/waagd-config-0600
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: waagd-discovery:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Read every embedded configuration as the restricted application user
        env:
          WAAGD_SMOKE_IMAGE: waagd-discovery:ci
          WAAGD_SMOKE_SKIP_BUILD: "1"
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: python3 scripts/docker-config-smoke.py --context "${{ runner.temp }}/waagd-config-0600"
      - name: Offline persistence and deduplication smoke
        env:
          WAAGD_SMOKE_IMAGE: waagd-discovery:ci
          WAAGD_SMOKE_SKIP_BUILD: "1"
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: sh scripts/docker-smoke.sh
      - name: Offline scheduler restart and recovery smoke
        env:
          WAAGD_SMOKE_IMAGE: waagd-discovery:ci
          WAAGD_SMOKE_SKIP_BUILD: "1"
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: python3 scripts/docker-scheduler-smoke.py
      - name: Offline automatic export and fake workspace bridge smoke
        env:
          WAAGD_SMOKE_IMAGE: waagd-discovery:ci
          WAAGD_SMOKE_SKIP_BUILD: "1"
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: python3 scripts/docker-bridge-smoke.py
      - name: Offline editorial processing and conditional ACK recovery smoke
        env:
          WAAGD_SMOKE_IMAGE: waagd-discovery:ci
          WAAGD_SMOKE_SKIP_BUILD: "1"
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: python3 scripts/docker-editorial-smoke.py
